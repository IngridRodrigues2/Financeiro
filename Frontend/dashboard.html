<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - Meu Financeiro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="dash-body">

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1"> Meu Financeiro</span>
  <div class="d-flex align-items-center gap-3">
    <span class="text-light small">Olá, <strong id="nomeUsuario">...</strong></span>
    <button id="btnSair" class="btn btn-outline-light btn-sm">Sair</button>
  </div>
</nav>

<div class="container py-4">

  <h6 class="text-muted text-uppercase small fw-bold mb-3">Resumo</h6>

  <div class="row g-3 mb-4">
    <div class="col-12 col-md-4">
      <div class="card shadow-sm border-start border-4 border-warning h-100">
        <div class="card-body">
          <div class="text-muted text-uppercase small fw-bold">Saldo</div>
          <div id="valorSaldo" class="fs-4 fw-bold mt-1">R$ 0,00</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card shadow-sm border-start border-4 border-success h-100">
        <div class="card-body">
          <div class="text-muted text-uppercase small fw-bold">Receitas</div>
          <div id="valorReceitas" class="fs-4 fw-bold mt-1 text-success">R$ 0,00</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card shadow-sm border-start border-4 border-danger h-100">
        <div class="card-body">
          <div class="text-muted text-uppercase small fw-bold">Despesas</div>
          <div id="valorDespesas" class="fs-4 fw-bold mt-1 text-danger">R$ 0,00</div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 mb-0">Transações</h2>
    <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#modalNovaTransacao">
      + Nova transação
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Tipo</th>
            <th class="d-none d-md-table-cell">Data</th>
          </tr>
        </thead>
        <tbody id="tabelaTransacoes">
          <!-- linhas geradas via js/dashboard.js -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal Nova Transação -->
<div class="modal fade" id="modalNovaTransacao" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nova transação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="formNovaTransacao">
        <div class="modal-body">
          <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" class="form-control" id="descricao" placeholder="Ex.: Salário, Mercado..." required>
          </div>
          <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" step="0.01" min="0" class="form-control" id="valor" placeholder="0,00" required>
          </div>
          <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" class="form-select">
              <option value="Receita">Receita</option>
              <option value="Despesa">Despesa</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="data" class="form-label">Data</label>
            <input type="date" class="form-control" id="data" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>

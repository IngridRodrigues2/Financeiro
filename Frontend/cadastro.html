<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta - Meu Financeiro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body d-flex align-items-center">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">

      <div class="text-center mb-4">
        <span class="fs-2"></span>
        <h1 class="h4 mt-2 mb-0">Meu Financeiro</h1>
        <p class="text-muted small">Controle suas receitas e despesas</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h5 mb-3">Criar cadastro</h2>

          <div id="cadastroErro" class="alert alert-danger py-2 small d-none"></div>
          <div id="cadastroSucesso" class="alert alert-success py-2 small d-none"></div>

          <form id="formCadastro" novalidate>
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" placeholder="Seu nome" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="voce@email.com" required>
            </div>
            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
              <label for="confirmarSenha" class="form-label">Confirmar senha</label>
              <input type="password" class="form-control" id="confirmarSenha" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Criar conta</button>
          </form>

          <p class="text-center small text-muted mt-3 mb-0">
            Já tem conta? <a href="login.html">Entrar</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
